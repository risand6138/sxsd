name: System Info and Neofetch Check
on:
  workflow_dispatch: # Manuálisan is elindíthatod a GitHub felületéről

jobs:
  sys-check:
    # Itt hivatkozol a GitHub felületén korábban létrehozott Larger Runner címkéjére
    runs-on: ubuntu-24-16core-64gb
    
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update apt package list
        run: |
          sudo apt-get update

      - name: Install Neofetch
        run: |
          sudo apt-get install -y neofetch

      - name: Run Neofetch and log output
        run: |
          echo "=== RUNNING NEOFETCH ===" > neofetch_output.log
          neofetch --stdout >> neofetch_output.log
          
          echo -e "\n=== CPU & RAM DETAILS ===" >> neofetch_output.log
          lscpu | grep -E '^CPU\(s\):|Model name' >> neofetch_output.log
          free -h >> neofetch_output.log
          
          # Megjelenítjük a GitHub Actions konzolon is, hogy azonnal lásd
          cat neofetch_output.log

      # Ez a lépés összegyűjti és letölthetővé teszi a log fájlt a számodra
      - name: Upload Neofetch Log Artifact
        uses: actions/upload-artifact@v4
        with:
          name: runner-system-specs-log
          path: neofetch_output.log
          retention-days: 7
